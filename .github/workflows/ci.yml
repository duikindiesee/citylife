name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - candidate/client-e8-protocol-v2

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-build:
    # Never execute fork-authored code on self-hosted runners. Same-repository branches are
    # the trusted contributor lane; pushes to main remain covered as well.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, citylife-cpu, kooker2-cpu]
    timeout-minutes: 40
    # The dedicated runner service runs under a non-interactive account whose
    # machine policy blocks generated PowerShell job scripts by default. Scope
    # the bypass to this already-restricted, trusted workflow only.
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        timeout-minutes: 30
      - run: npm run test:ci-report-publisher
      - run: npm run build
      - name: Upload unit and build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-artifacts-${{ github.sha }}
          path: |
            test-results/
            dist/
          if-no-files-found: ignore
          retention-days: 14

  e2e-browser:
    # Never execute fork-authored code on kooker1. Same-repository branches are
    # the trusted contributor lane; pushes to main remain covered as well.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, citylife-webgl, kooker1-gpu]
    timeout-minutes: 55
    env:
      CITYLIFE_HARDWARE_WEBGL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npx playwright install chromium
      # Pinned server revision: published corrective candidate 33f0336ad8df3ef42314dd2396d3821a4402a7ab
      # (queryless cookie auth session lifecycle, seated bus authority, parked asset validation, and coherent Sol clock)
      - name: Check out citylife-server at pinned authoritative revision
        uses: actions/checkout@v7
        with:
          repository: duikindiesee/citylife-server
          ref: 33f0336ad8df3ef42314dd2396d3821a4402a7ab
          token: ${{ secrets.CITYLIFE_SERVER_READ_TOKEN }}
          persist-credentials: false
          path: citylife-server
      - name: Install and build citylife-server
        working-directory: citylife-server
        run: |
          npm ci
          npm run build
      - name: Run multiplayer actual-pair acceptance
        env:
          CITYLIFE_SERVER_DIR: ${{ github.workspace }}/citylife-server
        run: npm run test:e2e:actual-pair
        timeout-minutes: 5
      - run: npm run test:e2e
        timeout-minutes: 45
      # Explicit step-level bound (PLAYER.MOBILE.E2E.1): the mobile/touch harness has its own
      # 90s whole-test timeout and a wrapper-enforced OS-level process-tree kill, but this step
      # timeout is the hosted backstop of last resort so a harness regression can never silently
      # consume the shared job budget.
      - run: npm run test:e2e:mobile-harness
        timeout-minutes: 4
      - name: Upload test and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ github.sha }}
          path: |
            test-results/
            videos/
          if-no-files-found: ignore
          retention-days: 14

  verify:
    needs: [unit-and-build, e2e-browser]
    if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Windows, X64, citylife-cpu, kooker2-cpu]
    timeout-minutes: 5
    steps:
      - name: Check aggregate test results
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          if ('${{ needs.unit-and-build.result }}' -ne 'success' -or '${{ needs.e2e-browser.result }}' -ne 'success') {
            Write-Error "Aggregate CI verify failed: unit-and-build=${{ needs.unit-and-build.result }}, e2e-browser=${{ needs.e2e-browser.result }}"
            exit 1
          }
          Write-Host "All required CI check legs (unit-and-build, e2e-browser) succeeded."
