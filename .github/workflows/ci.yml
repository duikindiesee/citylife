name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - candidate/client-e8-protocol-v2

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Never execute fork-authored code on kooker1. Same-repository branches are
    # the trusted contributor lane; pushes to main remain covered as well.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, citylife-webgl, kooker1-gpu]
    timeout-minutes: 60
    env:
      CITYLIFE_HARDWARE_WEBGL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The host keeps npm's cache between jobs; actions/setup-node's cache-save
      # post-step can hang on Windows self-hosted runners.
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ci-report-publisher
      - run: npm run test:e2e
      # Explicit step-level bound (PLAYER.MOBILE.E2E.1): the mobile/touch harness has its own
      # 90s whole-test timeout and a wrapper-enforced OS-level process-tree kill, but this step
      # timeout is the hosted backstop of last resort so a harness regression can never silently
      # consume the shared 60-minute job budget.
      - run: npm run test:e2e:mobile-harness
        timeout-minutes: 4
      # Pinned server revision: published corrective candidate 2f27c1260e46619d14ab7d4fe0a5a6a33b76f3b6
      # (walking-spawn and reconnect fail-closed authority; pending MoJoJo SOURCE review queue bridge-live 731551be)
      - name: Check out citylife-server at pinned authoritative revision
        uses: actions/checkout@v7
        with:
          repository: duikindiesee/citylife-server
          ref: 2f27c1260e46619d14ab7d4fe0a5a6a33b76f3b6
          token: ${{ secrets.CITYLIFE_SERVER_READ_TOKEN }}
          persist-credentials: false
          path: citylife-server
      - name: Install and build citylife-server
        working-directory: citylife-server
        run: |
          npm ci
          npm run build
      - name: Run multiplayer actual-pair acceptance
        env:
          CITYLIFE_SERVER_DIR: ${{ github.workspace }}/citylife-server
        run: npm run test:e2e:actual-pair
        timeout-minutes: 5
      - run: npm run build
